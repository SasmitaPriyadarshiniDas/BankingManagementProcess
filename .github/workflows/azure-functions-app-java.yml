name: Build Java Services

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account-service, transaction-service, eureka-server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Build ${{ matrix.service }}
        shell: pwsh
        run: |
          $service = "${{ matrix.service }}"
          $pomPath = Join-Path $service "pom.xml"

          if (-not (Test-Path $pomPath)) {
            throw "Missing pom.xml in '$service'"
          }

          mvn -f $pomPath clean package
